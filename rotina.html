<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Endereços de atendimento psicológico de rotina com busca por bairro e CEP."
    />
    <title>Atendimento de Rotina</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="rotina">
    <header class="site-header">
      <div class="wrap">
        <h1 class="site-title">Atendimento de Rotina</h1>
        <p class="site-tagline">
          Escolha uma unidade para acompanhamento psicológico regular, incluindo CAPS e opções em
          universidades.
        </p>
      </div>
    </header>

    <main class="wrap">
      <a class="back-link" href="index.html">Voltar para início</a>

      <section class="card">
        <h2>Buscar unidade mais próxima</h2>
        <form id="search-form" class="search-form" novalidate>
          <label for="bairro">Bairro</label>
          <input id="bairro" name="bairro" type="text" placeholder="Ex.: Aldeota" />

          <label for="cep">CEP</label>
          <input id="cep" name="cep" type="text" inputmode="numeric" placeholder="Ex.: 60160-081" />

          <button class="btn btn-secondary" type="submit">Encontrar local mais próximo</button>
        </form>
        <p id="status-message" class="hint"></p>
      </section>

      <section class="card">
        <h2>Endereços</h2>
        <ul id="results-list" class="result-list"></ul>
      </section>
    </main>

    <script src="main.js" defer></script>
  </body>
</html>
